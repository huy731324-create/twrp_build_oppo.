name: Build TWRP cho Oppo A5 2020
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          
      - name: Install Tools
        run: |
          sudo add-apt-repository universe
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison gperf build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip bc python3 || true
          sudo apt-get install -y libncurses5 || true
          
      - name: Install Repo
        run: |
          mkdir ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Sync TWRP Source
        run: |
          cd ~/twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags



      - name: Clone Device Tree
        run: |
          cd ~/twrp
          mkdir -p device/oppo/CPH1931
          curl -L https://github.com/skylot/android_device_oppo_CPH1931/archive/refs/heads/twrp-11.tar.gz -o tree.tar.gz
          tar -xvf tree.tar.gz -C device/oppo/CPH1931 --strip-components=1
          rm tree.tar.gz

         tar -xvf tree.tar.gz -C device/oppo/CPH1931 --strip-components=1
          rm tree.tar.gz


      
      - name: Build TWRP
        run: |
          cd ~/twrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch twrp_CPH1931-eng
          mka recoveryimage -j$(nproc --all)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Oppo-A5-2020
          path: /home/runner/twrp/out/target/product/CPH1931/recovery.img
